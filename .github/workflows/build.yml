name: build-single-binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build
          cd ..
          mkdir -p internal/ui/dist
          cp -r web/dist/* internal/ui/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUT=pansou-web-${GOOS}-${GOARCH}
          go build -trimpath -ldflags "-s -w" -o "$OUT" .
          if [ "$GOOS" = windows ]; then mv "$OUT" "${OUT}.exe"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pansou-web-${{ matrix.goos }}-${{ matrix.goarch }}
          path: pansou-web-*
