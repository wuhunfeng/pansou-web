name: build-linux-amd64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::7}"

          go build -trimpath \
            -ldflags "-s -w \
              -X main.Version=${VERSION} \
              -X main.Commit=${COMMIT}" \
            -o pansou-web .

          file pansou-web
          ldd pansou-web || true

      - name: Prepare deploy package
        run: |
          mkdir -p dist
          cp pansou-web dist/pansou-web
          cp README.md dist/README.md 2>/dev/null || true
          cp -r embeddata dist/embeddata 2>/dev/null || true
          cat > dist/.env.example <<'EOF'
          # pansou-web 环境变量
          PORT=8080
          DOMAIN=your.alwaysdata.net
          ENABLED_PLUGINS=labi,zhizhen,shandian,duoduo,muou,wanou
          CHANNELS=
          PROXY=
          AUTH_ENABLED=false
          AUTH_USERS=admin:admin123
          EOF

          cd dist
          tar -czf ../pansou-web-linux-amd64.tar.gz .
          cd ..

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pansou-web-linux-amd64.tar.gz
